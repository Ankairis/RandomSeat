name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject commit hash
        run: |
          HASH=$(git rev-parse HEAD)
          sed -i "s/__GIT_HASH__/$HASH/" index.html

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 26ea8f48c699b4def4bb9896627ff296
        run: wrangler pages deploy . --project-name=random-seat --branch=main
